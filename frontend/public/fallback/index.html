<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horde Battle: Graveyard Guard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', cursive;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    .scene {
      position: relative;
      width: 672px;
      height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Portrait orientation message */
    .rotate-message {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      z-index: 100;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .rotate-message p {
      font-size: 0.7rem;
      color: #aaa;
      line-height: 2;
    }

    @media (orientation: portrait) and (max-width: 480px) {
      .rotate-message { display: flex; }
    }

    /* ─── Title ─────────────────────────────────────────── */
    .title {
      text-align: center;
      position: absolute;
      bottom: 200px;
      z-index: 10;
    }

    .title h1 {
      font-size: 1.8rem;
      color: #c0392b;
      text-shadow: 3px 3px 0px #000;
      line-height: 1.8;
    }

    .title h2 {
      font-size: 0.75rem;
      color: #8e8e8e;
      letter-spacing: 0.15em;
      margin-top: 0.4rem;
      text-shadow: 2px 2px 0px #000;
    }

    /* ─── Terrain (single container, no gaps) ─────────── */
    .terrain {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      image-rendering: pixelated;
      font-size: 0;
      line-height: 0;
    }

    .terrain-row {
      display: flex;
      height: 48px;
      margin: 0;
      padding: 0;
    }

    .tile {
      width: 48px;
      height: 48px;
      background-image: url('../tilesets/plains.png');
      background-size: 288px 576px; /* 96×3, 192×3 */
      background-repeat: no-repeat;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .tile-left   { background-position: -48px -288px; }
    .tile-center { background-position: -96px -288px; }
    .tile-right  { background-position: -144px -288px; }

    .tile-surface-left   { background-position: -48px -240px; }
    .tile-surface-center { background-position: -96px -240px; }
    .tile-surface-right  { background-position: -144px -240px; }

    .tile-top-left   { background-position: -48px -192px; }
    .tile-top-center { background-position: -96px -192px; }
    .tile-top-right  { background-position: -144px -192px; }

    /* ─── Objects ───────────────────────────────────────── */
    .object {
      position: absolute;
      width: 48px;
      height: 48px;
      background-image: url('../objects/objects.png');
      background-size: 768px 624px; /* 256×3, 208×3 */
      background-repeat: no-repeat;
      image-rendering: pixelated;
      z-index: 1;
    }

    .tomb  { background-position: -288px 0px; }
    .skull { background-position: -384px 0px; }
    .rock  { background-position: 0px -48px; }

    .obj-tomb  { bottom: 128px; left: 150px; }
    .obj-skull { bottom: 128px; right: 190px; }
    .obj-rock1 { bottom: 272px; left: 50px; }
    .obj-rock2 { bottom: 272px; right: 80px; }

    /* ─── Characters ────────────────────────────────────── */
    .character {
      position: absolute;
      width: 144px;
      height: 144px;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      z-index: 2;
    }

    .player {
      background-image: url('../characters/player.png');
      background-size: 864px 1440px;
      bottom: 160px;
      left: 15px;
      animation: player-idle 0.8s steps(6) infinite;
    }

    .skeleton {
      background-image: url('../characters/skeleton_swordless.png');
      background-size: 864px 1440px;
      bottom: 100px;
      left: 480px;
      animation: skeleton-idle 0.8s steps(6) infinite;
    }

    .slime {
      background-image: url('../characters/slime.png');
      background-size: 672px 1248px;
      width: 96px;
      height: 96px;
      bottom: 196px;
      left: 528px;
      animation: slime-idle 0.6s steps(4) infinite;
    }

    @keyframes player-idle {
      from { background-position: 0px 0px; }
      to { background-position: -864px 0px; }
    }

    @keyframes skeleton-idle {
      from { background-position: 0px 0px; }
      to { background-position: -864px 0px; }
    }

    @keyframes slime-idle {
      from { background-position: 0px 0px; }
      to { background-position: -384px 0px; }
    }

    /* ─── Loading text ──────────────────────────────────── */
    .loading {
      position: absolute;
      bottom: 30px;
      font-size: 0.55rem;
      color: #aaa;
      animation: blink 1.2s steps(2) infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Rotate device message for portrait mobile -->
  <div class="rotate-message">
    <div>
      <h1 style="font-size:1.4rem; color:#c0392b; text-shadow:3px 3px 0px #000; line-height:1.8;">Horde Battle</h1>
      <h2 style="font-size:0.6rem; color:#8e8e8e; letter-spacing:0.15em; margin-top:0.4rem; text-shadow:2px 2px 0px #000;">Graveyard Guard</h2>
      <div style="display:flex; justify-content:center; gap:24px; margin-top:1.5rem;">
        <div style="width:48px; height:48px; background:url('../objects/objects.png') -288px 0px; background-size:768px 624px; image-rendering:pixelated;"></div>
        <div style="width:48px; height:48px; background:url('../objects/objects.png') -384px 0px; background-size:768px 624px; image-rendering:pixelated;"></div>
      </div>
      <p style="font-size:0.55rem; color:#aaa; margin-top:1.5rem; line-height:2.5;">Please rotate your device<br>to landscape mode</p>
    </div>
  </div>

  <div class="scene">
    <!-- Title -->
    <div class="title">
      <h1>Horde Battle</h1>
      <h2>Graveyard Guard</h2>
    </div>

    <!-- Terrain: single container, rows stacked with no gaps -->
    <div class="terrain">
      <div class="terrain-row">
        <div class="tile tile-top-left"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-center"></div>
        <div class="tile tile-top-right"></div>
      </div>
      <div class="terrain-row">
        <div class="tile tile-surface-left"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-right"></div>
      </div>
      <div class="terrain-row">
        <div class="tile tile-surface-left"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-right"></div>
      </div>
      <div class="terrain-row">
        <div class="tile tile-surface-left"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-center"></div>
        <div class="tile tile-surface-right"></div>
      </div>
      <div class="terrain-row">
        <div class="tile tile-left"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-center"></div>
        <div class="tile tile-right"></div>
      </div>
    </div>

    <!-- Decorative objects -->
    <div class="object tomb obj-tomb"></div>
    <div class="object rock obj-rock1"></div>
    <div class="object skull obj-skull"></div>
    <div class="object rock obj-rock2"></div>

    <!-- Characters -->
    <div class="character player"></div>
    <div class="character slime"></div>
    <div class="character skeleton"></div>

    <!-- Loading -->
    <p class="loading">Loading...</p>
  </div>
</body>
</html>
