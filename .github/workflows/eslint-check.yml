name: ESLint Validation

# ─────────────────────────────────────────────────────────────────────────────
# Validates TypeScript code against the project's ESLint configuration.
# Runs recursively across all packages (frontend, backend/lambdas, backend/cdk).
#
# Only ESLint ERRORS will fail the workflow. Warnings (no-console,
# explicit-function-return-type) are reported but do not block the merge.
#
# This is a required check: PRs cannot be merged if ESLint errors are present.
# Skipped on draft PRs to avoid unnecessary CI consumption during development.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  eslint:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm eslint . --ext .ts --ignore-path .gitignore
