name: Prettier Check

# ─────────────────────────────────────────────────────────────────────────────
# Verifies that all code is properly formatted according to the project's
# Prettier configuration (.prettierrc). Does NOT auto-fix — the developer
# must run the fix command locally before pushing.
#
# This is a required check: PRs cannot be merged if formatting is incorrect.
# Skipped on draft PRs to avoid unnecessary CI consumption during development.
#
# NOTE: Prettier evaluates code from both branches (target and source).
# If this check fails, it may be because the target branch contains code
# that doesn't exist in the source branch and that code is not properly
# formatted.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  prettier:
    name: Check Formatting
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: |
          if ! pnpm prettier --check frontend/ backend/ --ignore-path .gitignore; then
            echo ""
            echo "❌ Prettier check failed. Run the following command to fix formatting:"
            echo ""
            echo "  pnpm prettier --write frontend/ backend/ --ignore-path .gitignore"
            echo ""
            exit 1
          fi
