name: Prettier Check

# ─────────────────────────────────────────────────────────────────────────────
# Verifies that all code is properly formatted according to the project's
# Prettier configuration (.prettierrc). Does NOT auto-fix — the developer
# must run `prettier --write .` locally before pushing.
#
# This is a required check: PRs cannot be merged if formatting is incorrect.
# Skipped on draft PRs to avoid unnecessary CI consumption during development.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  prettier:
    name: Check Formatting
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm prettier --check . --ignore-path .gitignore
