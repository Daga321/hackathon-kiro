name: Validate Source Branch for Master

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  check-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Source branch: $SOURCE_BRANCH"
          
          # Allow if branch is 'develop' or starts with 'hotfix/'
          if [[ "$SOURCE_BRANCH" == "develop" || "$SOURCE_BRANCH" =~ ^hotfix/ ]]; then
            echo "Valid branch. Allowing Pull Request."
            exit 0
          else
            echo "ERROR: Merging into master is only allowed from 'develop' or 'hotfix/*' branches."
            exit 1
          fi
