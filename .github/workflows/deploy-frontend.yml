name: Deploy Frontend (S3)

# ─────────────────────────────────────────────────────────────────────────────
# This workflow builds the frontend and syncs it to the S3 bucket served
# by CloudFront.
#
# On push: only runs if files in frontend/** changed in the merge.
# On manual dispatch: always runs regardless of file changes.
#
# The S3 bucket name and CloudFront distribution ID are obtained dynamically
# from CloudFormation stack outputs. This ensures we always target the correct
# resources even if CDK recreates them.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  detect-changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    # Skip this job on manual dispatch — we always want to proceed
    if: github.event_name != 'workflow_dispatch'
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Run if: frontend files changed (push) OR manual dispatch
    if: |
      always() &&
      (needs.detect-changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # Retrieve bucket name and distribution ID from CloudFormation outputs.
      # These are not hardcoded — if CDK recreates resources, this always
      # resolves to the current values.
      - name: Get CloudFormation outputs
        id: cfn
        run: |
          STACK_NAME="StaticSiteStack-${{ env.ENVIRONMENT }}"

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          echo "::add-mask::$BUCKET_NAME"
          echo "::add-mask::$DISTRIBUTION_ID"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ steps.cfn.outputs.bucket_name }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # index.html gets a short cache so updates are picked up quickly
          aws s3 cp frontend/dist/index.html s3://${{ steps.cfn.outputs.bucket_name }}/index.html \
            --cache-control "public, max-age=60"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn.outputs.distribution_id }} \
            --paths "/index.html"
