name: Deploy Infrastructure (CDK)

# ─────────────────────────────────────────────────────────────────────────────
# This workflow deploys CDK infrastructure when changes are detected.
#
# Strategy for change detection (combined approach):
# 1. PATH FILTER: First we check if files in backend/cdk/** changed in this push.
#    If nothing changed, we skip entirely — saving time and AWS API calls.
# 2. CDK DIFF: If files did change, we run `cdk diff` against the live stack.
#    This confirms whether the changes actually produce infrastructure differences.
#    A code comment or formatting change won't trigger a deploy.
#
# On manual dispatch (workflow_dispatch), we skip the path filter and always
# run cdk diff → deploy if there are real differences. This is useful for
# recovering from drift or forcing a redeploy.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  detect-changes:
    name: Detect CDK changes
    runs-on: ubuntu-latest
    # Skip this job on manual dispatch — we always want to proceed
    if: github.event_name != 'workflow_dispatch'
    outputs:
      cdk_changed: ${{ steps.filter.outputs.cdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cdk:
              - 'backend/cdk/**'

  deploy:
    name: Deploy CDK Stack
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Run if: CDK files changed (push) OR manual dispatch
    if: |
      always() &&
      (needs.detect-changes.outputs.cdk_changed == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend/cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Set CDK environment variables
        run: |
          echo "AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ vars.AWS_DEFAULT_REGION }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> $GITHUB_ENV

      # CDK DIFF: Checks if there are real infrastructure differences
      # between the current code and what's deployed in CloudFormation.
      # This prevents unnecessary deploys when only comments or formatting changed.
      - name: CDK Diff
        id: diff
        working-directory: backend/cdk
        run: |
          DIFF_OUTPUT=$(npx cdk diff --no-color 2>&1) || true
          echo "$DIFF_OUTPUT"
          if echo "$DIFF_OUTPUT" | grep -q "There were no differences"; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No infrastructure changes detected. Skipping deploy."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "⚠️ Infrastructure changes detected. Proceeding with deploy."
          fi

      - name: CDK Deploy
        if: steps.diff.outputs.has_changes == 'true'
        working-directory: backend/cdk
        run: npx cdk deploy --all --require-approval never
